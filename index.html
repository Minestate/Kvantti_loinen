<!DOCTYPE html>
<html>
<head>
  <title>Chat_boxing (QEMU)</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
  <style>
    body { font-family: monospace; margin: 0; padding-bottom: 4rem; background: #0d1117; color: #c9d1d9; }
    #user-info { background: #161b22; padding: 0.8rem; border-bottom: 1px solid #30363d; font-weight: bold; color: #58a6ff; text-align: center; }
    #messages { list-style-type: none; margin: 0; padding: 1rem; border-left: 2px solid #00ff00; }
    #messages > li { padding: 0.8rem 1rem; margin-bottom: 0.5rem; background: #161b22; border: 1px solid #30363d; border-radius: 8px; transition: opacity 0.5s; }
    .msg-header { display: flex; justify-content: space-between; margin-bottom: 0.4rem; align-items: center; }
    .timer-container { display: flex; align-items: center; gap: 10px; }
    .timer { color: #f85149; font-weight: bold; }
    .undo-btn { background: #da3633; color: white; border: none; border-radius: 4px; padding: 2px 8px; font-size: 0.75em; cursor: pointer; }
    .undo-btn:hover { background: #f85149; }
    .process-log { font-size: 0.75em; color: #8b949e; margin-top: 0.4rem; display: none; }
    #form { background: #161b22; padding: 0.5rem; position: fixed; bottom: 0; left: 0; right: 0; display: flex; border-top: 1px solid #30363d; }
    #input { border: 1px solid #30363d; padding: 0.8rem; flex-grow: 1; border-radius: 2rem; background: #0d1117; color: #fff; }
    button[type="submit"] { padding: 0 1.5rem; margin-left: 0.5rem; border-radius: 2rem; background: #238636; color: white; border: none; cursor: pointer; }
  </style>
</head>
<body>

  <div id="user-info">QEMU Solmu: <span id="my-name">...</span></div>
  <ul id="messages"></ul>
  
  <form id="form">
    <input id="input" autocomplete="off" placeholder="Salainen viesti (vähintään 6 sanaa)..." maxlength="5000" />
    <button type="submit">Lähetä</button>
  </form>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    var socket = io();
    var myUsername = "";
    const SALA_AVAIN = "SalainenAvain12345";
    const ELINKAARI = 21; // Muistinhallinnan ajastin sekunteina

    document.addEventListener("DOMContentLoaded", () => {
      myUsername = "QEMU_Node_" + Math.floor(Math.random() * 999);
      document.getElementById('my-name').innerText = myUsername;
    });

    document.getElementById('form').onsubmit = (e) => {
      e.preventDefault();
      var input = document.getElementById('input');
      var teksti = input.value.trim();
      var sanat = teksti.split(/\s+/).filter(w => w.length > 0);

      if (sanat.length < 6) {
        alert("Viestissä on oltava vähintään 6 sanaa! (Nyt: " + sanat.length + ")");
        return;
      }

      var viestiData = { user: myUsername, text: teksti };
      var kryptattu = CryptoJS.AES.encrypt(JSON.stringify(viestiData), SALA_AVAIN).toString();
      socket.emit('chat message', kryptattu);
      input.value = '';
    };

    socket.on('chat message', (kryptattu) => {
      var bytes = CryptoJS.AES.decrypt(kryptattu, SALA_AVAIN);
      var data = JSON.parse(bytes.toString(CryptoJS.enc.Utf8));
      
      var item = document.createElement('li');
      item.innerHTML = `
        <div class="msg-header">
          <span style="color:#79c0ff;">${data.user}</span>
          <div class="timer-container">
            <button class="undo-btn">Peru poisto</button>
            <span class="timer">${ELINKAARI}s</span>
          </div>
        </div>
        <div>${data.text}</div>
        <div class="process-log"></div>
      `;
      
      document.getElementById('messages').appendChild(item);
      
      let sec = ELINKAARI;
      let cancelled = false;
      let undoBtn = item.querySelector('.undo-btn');
      let timerSpan = item.querySelector('.timer');

      let timer = setInterval(() => {
        if (cancelled) return;
        sec--;
        timerSpan.innerText = sec + "s";
        
        if(sec <= 0) {
          clearInterval(timer);
          if (!cancelled) {
            suoritaKatoaminen(item);
          }
        }
      }, 1000);

      undoBtn.onclick = () => {
        cancelled = true;
        clearInterval(timer);
        undoBtn.remove();
        timerSpan.innerText = "PERUTTU";
        timerSpan.style.color = "#3fb950";
        item.style.borderColor = "#238636";
        
        setTimeout(() => {
          timerSpan.style.display = 'none';
        }, 1500);
      };
    });

    function suoritaKatoaminen(elem) {
      let btn = elem.querySelector('.undo-btn');
      if (btn) btn.remove();

      elem.querySelector('.timer').innerText = "TYHJENNETÄÄN";
      let log = elem.querySelector('.process-log');
      log.style.display = 'block';
      setTimeout(() => { log.innerHTML = "[A] Muistipuskurista poisto..."; }, 200);
      setTimeout(() => { log.innerHTML = "[B] Solmun puhdistus valmis."; elem.style.opacity = 0; setTimeout(() => elem.remove(), 500); }, 1000);
    }
  </script>
</body>
</html>
