<!DOCTYPE html>
<html>
<head>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <div style="width: 80%; margin: auto;">
        <canvas id="eheysChart"></canvas>
    </div>
    <script>
        // Reaktori päivittää tätä dataa reaaliajassa
        const ctx = document.getElementById('eheysChart').getContext('2d');
        const chart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: ['T-4', 'T-3', 'T-2', 'T-1', 'NYT'],
                datasets: [{
                    label: 'Perustan eheys (Integriteetti)',
                    data: [0.92, 0.94, 0.95, 0.98, 1.0],
                    borderColor: 'rgb(75, 192, 192)',
                    tension: 0.1
                }]
            }
        });
    </script>
</body>
</html>
<!DOCTYPE html>
<html>
<head>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <div style="width: 80%; margin: auto; padding: 20px;">
        <canvas id="massChart"></canvas>
    </div>
    <script>
        const ctx = document.getElementById('massChart').getContext('2d');
        const massChart = new Chart(ctx, {
            type: 'bar',
            data: {
                labels: ['T1', 'T2', 'T3', 'T4', 'NYT'],
                datasets: [{
                    label: 'Perustan tietomassa (tavuina)',
                    data: [1024, 2560, 4096, 8192, 16384],
                    backgroundColor: 'rgba(54, 162, 235, 0.5)',
                    borderColor: 'rgba(54, 162, 235, 1)',
                    borderWidth: 1
                }]
            },
            options: { scales: { y: { beginAtZero: true } } }
        });
    </script>
</body>
</html>
